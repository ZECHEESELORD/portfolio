<svg xmlns="http://www.w3.org/2000/svg" width="520" height="690" viewBox="0 0 520 690" role="img" aria-labelledby="title desc">
  <title id="title">Polling versus logical deadlines</title>
  <desc id="desc">Native polling updates and checks every player each tick. For an eligible consented loop, DPO advances a logical epoch, finds due players, materializes their scores, and runs the original action inline.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#36584d"/></marker></defs>
  <rect width="520" height="690" fill="#f5f7f6"/>
  <g font-family="Arial, sans-serif" fill="#203c35" text-anchor="middle">
    <text x="260" y="48" font-size="26" font-weight="700">A narrowly eligible counter loop</text>
    <rect x="28" y="78" width="464" height="145" rx="4" fill="#f0dedb" stroke="#a46d65"/>
    <text x="260" y="115" font-size="24" font-weight="700">Native: every tick, every player</text>
    <g font-size="21">
      <text x="260" y="154">Increment score, test threshold</text>
      <text x="260" y="189">Run action when threshold is met</text>
    </g>
    <text x="260" y="268" font-size="24" font-weight="700">DPO: eligible loop + pack consent</text>
    <g fill="#d5e8df" stroke="#6e9284">
      <rect x="48" y="295" width="424" height="65" rx="4"/>
      <rect x="48" y="400" width="424" height="65" rx="4"/>
      <rect x="48" y="505" width="424" height="65" rx="4"/>
    </g>
    <g font-size="23">
      <text x="260" y="336">Advance logical epoch</text>
      <text x="260" y="441">Find due players; materialize scores</text>
      <text x="260" y="546">Run original action inline</text>
    </g>
    <g font-size="20" fill="#526b62">
      <text x="260" y="614">Internal counters may stay virtual</text>
      <text x="260" y="645">until an observation or save boundary.</text>
    </g>
  </g>
  <g fill="none" stroke="#36584d" stroke-width="2.5" marker-end="url(#arrow)"><path d="M260 360v29"/><path d="M260 465v29"/></g>
</svg>
