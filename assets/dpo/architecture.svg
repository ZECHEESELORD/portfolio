<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1110" viewBox="0 0 520 1110" role="img" aria-labelledby="title desc">
  <title id="title">DPO analysis and activation pipeline</title>
  <desc id="desc">Enabled packs become a program index and effect analysis. Planning produces reports and a dormant bundle. Installed-provider and vanilla-evidence gates qualify inline optimization. Rejected work or failed qualification stays native.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#36584d"/></marker></defs>
  <rect width="520" height="1110" fill="#f5f7f6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#203c35">
    <text x="260" y="49" font-size="26" font-weight="700">From pack stack to runtime</text>
    <g fill="#ffffff" stroke="#6e9284" stroke-width="2">
      <rect x="40" y="80" width="440" height="100" rx="4"/>
      <rect x="40" y="220" width="440" height="100" rx="4"/>
      <rect x="40" y="360" width="440" height="100" rx="4"/>
      <rect x="40" y="545" width="440" height="100" rx="4"/>
      <rect x="40" y="685" width="440" height="115" rx="4"/>
      <rect x="40" y="840" width="440" height="95" rx="4" fill="#d5e8df"/>
      <rect x="40" y="975" width="440" height="100" rx="4" fill="#f0dedb" stroke="#a46d65"/>
    </g>
    <g font-size="24" font-weight="700">
      <text x="260" y="121">Enabled pack stack</text>
      <text x="260" y="260">Program index</text>
      <text x="260" y="400">Effects + candidate planning</text>
      <text x="260" y="585">Dormant deployment bundle</text>
      <text x="260" y="728">Activation gate</text>
      <text x="260" y="880">Inline optimized execution</text>
      <text x="260" y="1015">Native execution</text>
    </g>
    <g font-size="20">
      <text x="260" y="151">Preserve provider priority</text>
      <text x="260" y="290">Winning functions, tags, calls</text>
      <text x="260" y="430">Premises, proof, cost, consent</text>
      <text x="260" y="500" fill="#526b62">Decision reports explain rejections</text>
      <text x="260" y="615">Candidate does not mean active</text>
      <text x="260" y="759">Installed providers + vanilla evidence</text>
      <text x="260" y="784">Matching generation + lifecycle signal</text>
      <text x="260" y="910">Keep the original command position</text>
      <text x="260" y="1045">Unsupported, rejected, or unqualified</text>
    </g>
  </g>
  <g fill="none" stroke="#36584d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M260 180v31"/><path d="M260 320v31"/>
    <path d="M260 512v22"/><path d="M260 645v29"/>
    <path d="M260 800v29"/>
    <path d="M480 410h24v615h-13" stroke="#a46d65"/>
    <path d="M480 745h24" stroke="#a46d65"/>
  </g>
</svg>
